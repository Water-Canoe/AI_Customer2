<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI拓客授权管理</title>
  <style>
    :root { color-scheme: light; font-family: Inter,"Microsoft YaHei",sans-serif; color:#18332f; background:#f4f8f7 }
    * { box-sizing:border-box }
    body { margin:0; padding:24px }
    main { max-width:1180px; margin:auto }
    h1,h2 { margin:0 0 8px }
    p { color:#647773; margin:0 0 16px }
    .panel { background:#fff; border:1px solid #dce8e5; border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 8px 28px rgba(19,70,61,.05) }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px }
    label { display:grid; gap:6px; font-size:13px; color:#526864 }
    input,select,textarea,button { font:inherit }
    input,select,textarea { width:100%; padding:10px 12px; border:1px solid #cddbd8; border-radius:9px; background:#fff }
    textarea { min-height:76px; resize:vertical }
    button { border:0; border-radius:9px; padding:9px 14px; cursor:pointer; background:#e8f1ef; color:#173f38 }
    button.primary { background:#087f6d; color:#fff }
    button.danger { background:#fde9e9; color:#a32b2b }
    button:disabled { opacity:.5; cursor:not-allowed }
    .actions,.checks { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px }
    .checks label { display:flex; align-items:center; gap:5px }
    .checks input { width:auto }
    table { width:100%; border-collapse:collapse; font-size:13px }
    th,td { text-align:left; padding:10px 8px; border-bottom:1px solid #e7efed; vertical-align:top }
    th { color:#637773 }
    code { font-size:12px }
    .scroll { overflow:auto }
    .created { display:none; padding:12px; margin-top:12px; border-radius:9px; background:#ecfaf6 }
    .created code { user-select:all; word-break:break-all }
    .muted { color:#7a8d89 }
    #log { white-space:pre-wrap; max-height:160px; overflow:auto; font-size:12px; background:#142522; color:#d7ebe6; padding:12px; border-radius:9px }
    @media (max-width:760px) { body{padding:12px}.grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>AI拓客授权管理</h1>
    <p>一个客户使用一个产品授权码；功能通过权益开关控制，设备由客户端首次激活。</p>
    <div class="grid">
      <label>Sealos API Base<input id="apiBase" value="https://tfwqsfaegbdj.sealosbja.site/ai-customer"></label>
      <label>管理 Token（仅保存在当前页面内存）<input id="adminToken" type="password" autocomplete="off"></label>
    </div>
    <div class="actions"><button class="primary" id="refreshBtn">连接并刷新</button><button id="healthBtn">健康检查</button></div>
  </section>

  <section class="panel">
    <h2>创建授权</h2>
    <div class="checks">
      <strong>开通功能：</strong>
      <label><input type="checkbox" name="entitlement" value="lead" checked>拓客</label>
      <label><input type="checkbox" name="entitlement" value="traffic" checked>引流</label>
      <label><input type="checkbox" name="entitlement" value="content" checked>内容</label>
    </div>
    <div class="grid" style="margin-top:12px">
      <label>最大设备数<input id="createMax" type="number" min="1" max="100" value="3"></label>
      <label>过期时间（留空为长期）<input id="createExpiry" type="datetime-local"></label>
    </div>
    <label style="margin-top:12px">备注<textarea id="createRemark" placeholder="客户名称、订单号等"></textarea></label>
    <div class="actions"><button class="primary" id="createBtn">创建授权</button></div>
    <div class="created" id="createdBox">授权码只展示这一次：<code id="createdCode"></code> <button id="copyBtn">复制</button></div>
  </section>

  <section class="panel">
    <h2>授权列表</h2>
    <div class="scroll"><table><thead><tr><th>前缀</th><th>状态</th><th>功能</th><th>设备</th><th>过期</th><th>备注</th><th>操作</th></tr></thead><tbody id="licenseRows"></tbody></table></div>
  </section>

  <section class="panel" id="editor" hidden>
    <h2>修改授权</h2>
    <p id="selectedHint"></p>
    <div class="grid">
      <label>状态<select id="editStatus"><option value="active">启用</option><option value="disabled">停用</option></select></label>
      <label>最大设备数<input id="editMax" type="number" min="1" max="100"></label>
      <label>过期时间（留空为长期）<input id="editExpiry" type="datetime-local"></label>
      <label>备注<input id="editRemark"></label>
    </div>
    <div class="checks">
      <strong>功能：</strong>
      <label><input type="checkbox" name="editEntitlement" value="lead">拓客</label>
      <label><input type="checkbox" name="editEntitlement" value="traffic">引流</label>
      <label><input type="checkbox" name="editEntitlement" value="content">内容</label>
    </div>
    <div class="actions"><button class="primary" id="saveBtn">保存修改</button><button id="loadDevicesBtn">刷新设备</button></div>
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>设备码</th><th>设备名</th><th>版本</th><th>状态</th><th>最近续租</th><th>操作</th></tr></thead><tbody id="deviceRows"></tbody></table></div>
  </section>

  <section class="panel"><h2>操作日志</h2><div id="log">等待操作</div></section>
</main>
<script>
  const $ = selector => document.querySelector(selector)
  const state = { licenses: [], selected: null }

  function config() {
    return { base: $('#apiBase').value.trim().replace(/\/$/, ''), token: $('#adminToken').value.trim() }
  }

  async function request(path, { method = 'GET', body } = {}) {
    const { base, token } = config()
    if (!base || !token) throw new Error('请先填写 API Base 和管理 Token')
    const response = await fetch(base + path, {
      method,
      headers: { Accept: 'application/json', Authorization: `Bearer ${token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    })
    const result = await response.json().catch(() => null)
    if (!response.ok) throw new Error(result?.message || `HTTP ${response.status}`)
    return result
  }

  function run(action) {
    return async () => {
      try { await action() } catch (error) { log(`失败：${error.message}`); alert(error.message) }
    }
  }

  function log(message, data) {
    $('#log').textContent = `[${new Date().toLocaleString()}] ${message}${data ? `\n${JSON.stringify(data, null, 2)}` : ''}\n\n${$('#log').textContent}`
  }

  function checked(name) {
    return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(item => item.value)
  }

  function localTime(value) {
    if (!value) return ''
    const date = new Date(value)
    const offset = date.getTimezoneOffset() * 60000
    return new Date(date.getTime() - offset).toISOString().slice(0, 16)
  }

  function iso(value) { return value ? new Date(value).toISOString() : null }
  function displayTime(value) { return value ? new Date(value).toLocaleString() : '长期' }
  function featureNames(values) { return (values || []).map(value => ({ lead:'拓客', traffic:'引流', content:'内容' }[value] || value)).join('、') }

  async function refresh() {
    const result = await request('/admin/licenses')
    state.licenses = result.data || []
    $('#licenseRows').innerHTML = state.licenses.map(item => `<tr>
      <td><code>${item.codePrefix}</code></td><td>${item.status}</td><td>${featureNames(item.entitlements)}</td>
      <td>${item.activeDeviceCount}/${item.maxDevices}</td><td>${displayTime(item.expiresAt)}</td><td>${escapeHtml(item.remark || '-')}</td>
      <td><button data-edit="${item.licenseId}">管理</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">暂无授权</td></tr>'
    document.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => select(button.dataset.edit)))
    log('授权列表已刷新')
  }

  async function createLicense() {
    const result = await request('/admin/licenses', { method:'POST', body:{
      entitlements: checked('entitlement'), maxDevices: Number($('#createMax').value), expiresAt: iso($('#createExpiry').value), remark: $('#createRemark').value.trim(),
    } })
    $('#createdCode').textContent = result.data.licenseCode
    $('#createdBox').style.display = 'block'
    log('授权已创建；完整授权码不会再次从服务端返回', { licenseId: result.data.licenseId, codePrefix: result.data.codePrefix })
    await refresh()
  }

  async function select(id) {
    state.selected = state.licenses.find(item => item.licenseId === id)
    if (!state.selected) return
    $('#editor').hidden = false
    $('#selectedHint').textContent = `${state.selected.codePrefix} · ${state.selected.licenseId}`
    $('#editStatus').value = state.selected.status === 'expired' ? 'active' : state.selected.status
    $('#editMax').value = state.selected.maxDevices
    $('#editExpiry').value = localTime(state.selected.expiresAt)
    $('#editRemark').value = state.selected.remark || ''
    document.querySelectorAll('input[name="editEntitlement"]').forEach(item => item.checked = state.selected.entitlements.includes(item.value))
    await loadDevices()
  }

  async function saveSelected() {
    if (!state.selected) return
    await request(`/admin/licenses/${state.selected.licenseId}`, { method:'PATCH', body:{
      status: $('#editStatus').value, maxDevices: Number($('#editMax').value), expiresAt: iso($('#editExpiry').value), remark: $('#editRemark').value.trim(), entitlements: checked('editEntitlement'),
    } })
    log('授权已更新')
    await refresh()
    await select(state.selected.licenseId)
  }

  async function loadDevices() {
    if (!state.selected) return
    const result = await request(`/admin/licenses/${state.selected.licenseId}/devices`)
    $('#deviceRows').innerHTML = (result.data || []).map(item => `<tr><td><code>${escapeHtml(item.deviceId)}</code></td><td>${escapeHtml(item.deviceName || '-')}</td><td>${escapeHtml(item.appVersion || '-')}</td><td>${item.status}</td><td>${displayTime(item.lastRenewedAt)}</td><td>${item.status === 'active' ? `<button class="danger" data-revoke="${escapeHtml(item.deviceId)}">撤销</button>` : '-'}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">暂无设备</td></tr>'
    document.querySelectorAll('[data-revoke]').forEach(button => button.addEventListener('click', run(() => revoke(button.dataset.revoke))))
  }

  async function revoke(deviceId) {
    if (!confirm(`确认撤销设备 ${deviceId}？`)) return
    await request(`/admin/licenses/${state.selected.licenseId}/devices/${encodeURIComponent(deviceId)}/revoke`, { method:'POST' })
    log(`设备已撤销：${deviceId}`)
    await loadDevices(); await refresh()
  }

  function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])) }

  $('#refreshBtn').addEventListener('click', run(refresh))
  $('#healthBtn').addEventListener('click', run(async () => log('健康检查通过', await request('/healthz'))))
  $('#createBtn').addEventListener('click', run(createLicense))
  $('#saveBtn').addEventListener('click', run(saveSelected))
  $('#loadDevicesBtn').addEventListener('click', run(loadDevices))
  $('#copyBtn').addEventListener('click', run(async () => { await navigator.clipboard.writeText($('#createdCode').textContent); log('授权码已复制') }))
</script>
</body>
</html>
